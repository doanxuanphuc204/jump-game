<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>Geometry Jump</title>
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;background:#000;overflow:hidden;font-family:Arial,sans-serif}
    #unity-container{position:fixed;inset:0;background:#000}
    #unity-canvas{width:100%;height:100%;display:block;background:#000;outline:none}
    #loading{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:#090909;color:#fff;overflow:auto;padding:18px}
    .card{width:min(520px,94vw);text-align:center;margin:auto}
    .title{font-size:24px;font-weight:700;margin-bottom:16px}
    .bar{height:14px;border:2px solid #fff;border-radius:9px;overflow:hidden;background:#222}
    #progress{height:100%;width:0;background:#fff;transition:width .1s linear}
    #status{margin-top:10px;font-size:14px;opacity:.85}
    #play{display:none;margin:18px auto 0;padding:13px 38px;border:3px solid #fff;border-radius:50px;font-size:20px;font-weight:700;cursor:pointer;background:#2ecc71;color:#fff;box-shadow:0 5px 15px rgba(0,0,0,.4)}
    #play:hover{background:#27ae60;transform:scale(1.04)}
    @media (max-height:620px){#loading{align-items:flex-start}.title{font-size:20px;margin-bottom:10px}#play{margin-top:12px}}
  </style>
</head>
<body>
  <div id="unity-container"><canvas id="unity-canvas" width="1920" height="1080" tabindex="-1"></canvas></div>
  <div id="loading">
    <div class="card">
      <div class="title">Geometry Jump</div>
      <div class="bar"><div id="progress"></div></div>
      <div id="status">Loading game…</div>
      <button id="play" type="button">PLAY GAME</button>
    </div>
  </div>
  <script>
    window.originalFolder = new URL('.', location.href).href.replace(/\/$/, '');

    // Pin game-owned TXT requests to the current game folder, even if Unity asks for ../setting.txt.
    (function installGamePathFix() {
      const gameBase = window.originalFolder + '/';
      function remapUrl(raw) {
        try {
          const u = new URL(String(raw), location.href);
          if (u.origin !== location.origin) return raw;
          const fileName = u.pathname.split('/').pop().toLowerCase();
          if (fileName === 'setting.txt') return gameBase + 'setting.txt' + u.search + u.hash;
          if (fileName === 'game.txt') return gameBase + 'game.txt' + u.search + u.hash;
        } catch (e) {}
        return raw;
      }
      if (window.fetch) {
        const nativeFetch = window.fetch.bind(window);
        window.fetch = function(input, init) {
          if (typeof Request !== 'undefined' && input instanceof Request) {
            const fixed = remapUrl(input.url);
            if (fixed !== input.url) input = new Request(fixed, input);
          } else { input = remapUrl(input); }
          return nativeFetch(input, init);
        };
      }
      const nativeXHROpen = XMLHttpRequest.prototype.open;
      XMLHttpRequest.prototype.open = function(method, url) {
        const args = Array.prototype.slice.call(arguments);
        args[1] = remapUrl(url);
        return nativeXHROpen.apply(this, args);
      };
    })();

    // Compatibility shim: this Unity build calls a host-page helper named tapOrClick().
    // Some source sites define it in their wrapper; standalone hosting does not.
    // Keep it as a safe no-op so starting a level never crashes.
    if (typeof window.tapOrClick !== 'function') {
      window.tapOrClick = function(){};
    }

    // No original-site H5 ad/popup layer. The framework reward hook reports success immediately.
    window.show_ads_inGame = function(){};
    window.show_ads_inGame_dp = function(){};
    window.none_ads_inGame = function(){};
    window.show_Ads1 = function(){};
    window.show_Ads_Loading = function(){};

    const nativeOpen = window.open ? window.open.bind(window) : null;
    window.open = function(url, ...args) {
      try {
        const u = new URL(String(url), location.href);
        if (u.hostname === 'slope3.com' || u.hostname.endsWith('.slope3.com')) return null;
      } catch (e) {}
      return nativeOpen ? nativeOpen(url, ...args) : null;
    };

    const canvas = document.querySelector('#unity-canvas');
    const loading = document.querySelector('#loading');
    const progress = document.querySelector('#progress');
    const status = document.querySelector('#status');
    const play = document.querySelector('#play');
    const buildUrl = 'Build';
    const config = {
      dataUrl: buildUrl + '/geometry-jump.data',
      frameworkUrl: buildUrl + '/geometry-jump.framework.js',
      codeUrl: buildUrl + '/geometry-jump.wasm',
      streamingAssetsUrl: window.originalFolder + '/StreamingAssets',
      companyName: 'Greenlight',
      productName: 'Geometry Jump',
      productVersion: '1.0.1'
    };

    const script = document.createElement('script');
    script.src = buildUrl + '/geometry-jump.loader.js';
    script.onload = () => {
      createUnityInstance(canvas, config, p => {
        progress.style.width = Math.round(p * 100) + '%';
        status.textContent = 'Loading game… ' + Math.round(p * 100) + '%';
      }).then(instance => {
        window.unityInstance = instance;
        progress.style.width = '100%';
        status.textContent = 'Ready';
        play.style.display = 'inline-block';
        play.addEventListener('click', () => {
          loading.style.display = 'none';
          canvas.focus();
          try {
            const ac = instance && instance.Module && instance.Module.SDL2 && instance.Module.SDL2.audioContext;
            if (ac && ac.state === 'suspended') ac.resume();
          } catch (e) {}
          window.dispatchEvent(new Event('resize'));
        }, {once:true});
      }).catch(err => { console.error(err); status.textContent = 'Load error. Open DevTools > Console for details.'; });
    };
    script.onerror = () => { status.textContent = 'Could not load Unity loader.'; };
    document.body.appendChild(script);
  </script>
</body>
</html>
